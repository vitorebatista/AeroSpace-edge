site_name: AeroSpace-edge
site_description: An i3-like tiling window manager for macOS - the AeroSpace-edge fork
site_url: https://vitorebatista.github.io/AeroSpace-edge/
repo_url: https://github.com/vitorebatista/AeroSpace-edge
repo_name: vitorebatista/AeroSpace-edge
edit_uri: edit/main/docs-md/
docs_dir: docs-md

theme:
  name: material
  logo: assets/edge-logo.svg
  favicon: assets/edge-appicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - llmstxt:
      markdown_description: "An i3-like tiling window manager for macOS. CLI binary: aerospace-edge."
      sections:
        Commands:
          - commands/*.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed: { alternate_style: true }

nav:
  - Home: index.md
  - Guide: guide.md
  - Settings:
      - settings/index.md
      - settings/general.md
      - settings/layout.md
      - settings/gaps.md
      - settings/focus.md
      - settings/window-border.md
      - settings/workspaces.md
      - settings/key-mapping.md
      - settings/exec.md
      - settings/keybindings.md
      - settings/window-rules.md
      - settings/callbacks.md
      - settings/menu-bar.md
      - settings/application.md
      - settings/migration.md
  - Comparison: comparison.md
  - Goodies: goodies.md
  - Commands:
      - aerospace-edge.md
      - commands/balance-sizes.md
      - commands/close-all-windows-but-current.md
      - commands/close.md
      - commands/config.md
      - commands/debug-windows.md
      - commands/echo.md
      - commands/enable-normalization.md
      - commands/enable.md
